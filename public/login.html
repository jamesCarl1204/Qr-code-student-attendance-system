<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regis Marie College - QR Attendance System</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="app">

        <header class="topnav">
            <div class="brand">
                <div class="logo-box">QR</div>
                <div class="brand-text">
                    <h1>Regis Marie College</h1>
                    <p>QR Attendance Monitoring</p>
                </div>
            </div>

        </header>

        <main class="landing">
            <div class="hero-copy">
                <h2>Fast, Accurate QR-Based Attendance.</h2>
                <p>Scan in seconds, keep parents informed automatically, and give teachers real-time attendance visibility.</p>
            </div>

            <div class="hero-options">
                <button class="hero-card" id="hero-student">
                    <div class="hero-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                    <div class="hero-text">
                        <h3>Student Access</h3>
                        <p>View your digital QR pass and attendance records.</p>
                    </div>
                </button>

                <button class="hero-card" id="hero-teacher">
                    <div class="hero-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
                    <div class="hero-text">
                        <h3>Teacher Portal</h3>
                        <p>Run live QR scanning and manage class rosters.</p>
                    </div>
                </button>
            </div>
        </main>
    </div>

    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-card">

            <div class="modal-header">
                <div class="brand">
                    <div class="logo-box">QR</div>
                    <div class="brand-text">
                        <h3 id="modal-title">Student Sign In</h3>
                        <p id="modal-subtitle">Enter your student credentials</p>
                    </div>
                </div>
                <button type="button" id="close-modal" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="student-login-form" class="modal-form">
                <label>Email</label>
                <input type="email" id="stud-email" placeholder="Enter email..." required>
                <div id="stud-email-err" class="err"></div>

                <label>Password</label>
                <input type="password" id="stud-password" placeholder="Enter password..." required>
                <div id="stud-password-err" class="err"></div>

                <button type="submit" id="student-login-btn">Sign In</button>
            </form>

            <form id="teacher-login-form" class="modal-form hidden">
                <label>Email</label>
                <input type="email" id="t-login-email" placeholder="Enter email..." required>
                <div id="t-login-email-err" class="err"></div>

                <label>Password</label>
                <input type="password" id="t-login-password" placeholder="Enter password..." required>
                <div id="t-log-password-err" class="err"></div>

                <button type="submit" id="teacher-login-btn">Sign In</button>
            </form>

            <form id="student-register-form" class="modal-form hidden">
                <div class="grid-2">
                    <div>
                        <label>Student ID</label>
                        <input id="student-id" placeholder="Enter student ID..." required>
                        <div id="id-err" class="err"></div>
                    </div>
                    <div>
                        <label>First Name</label>
                        <input id="name-input" placeholder="Enter name..." required>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Middle Name</label>
                        <input id="middlename-input" placeholder="Optional">
                    </div>
                    <div>
                        <label>Last Name</label>
                        <input id="lastname-input" placeholder="Enter lastname..." required>
                    </div>
                </div>

                <label>Student Email</label>
                <input id="email-input" type="email" placeholder="Enter email..." required>
                <div id="email-err" class="err"></div>

                <label>Password</label>
                <input id="password-input" type="password" placeholder="Enter password..." required>
                <div id="password-err" class="err"></div>

                <label>Confirm Password</label>
                <input id="password-confirm" type="password" placeholder="Confirm password..." required>
                <div id="confirm-err" class="err"></div>

                <label>Parent's Email</label>
                <input id="parent-email" type="email" placeholder="Parent/guardian email..." required>
                <div id="parent-email-err" class="err"></div>

                <button type="submit" id="register-btn">Create Student Account</button>
            </form>

            <div class="modal-footer">
                <p id="modal-toggle-text">New student? <button type="button" id="toggle-mode-btn">Register here</button></p>
            </div>

        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
